# Ansible settings, picked up automatically when you run ansible from this folder.
[defaults]
inventory = inventory.ini
remote_user = dan
# Refuse to connect if a node's SSH host key changes (protects against impersonation)
host_key_checking = True
# Use the node's own Python without printing a warning about it
interpreter_python = auto_silent

[privilege_escalation]
# Ubuntu 25.10+ uses sudo-rs as "sudo", and its password prompt isn't recognised by
# Ansible's become (it times out "waiting for privilege escalation prompt").
# The classic sudo is still installed as sudo.ws, so Ansible uses that instead.
become_exe = sudo.ws
