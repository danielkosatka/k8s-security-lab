# Ansible inventory: every machine in the lab, grouped by role.
# Ansible runs on obs (the management host) and reaches the others over the lab network.

[control_plane]
k8s-cp ansible_host=192.168.100.10

[workers]
k8s-w1 ansible_host=192.168.100.11
k8s-w2 ansible_host=192.168.100.12

[observability]
# obs is where Ansible runs, so it manages itself directly instead of over SSH
obs ansible_connection=local

# The Kubernetes cluster = control plane + workers (obs is not part of the cluster)
[k8s_cluster:children]
control_plane
workers
