# /etc/ssh/sshd_config.d/10-hardening.conf on every node.
# sshd uses the FIRST value it reads, and reads this folder in alphabetical order,
# so "10-" overrides the installer's 50-cloud-init.conf (which sets PasswordAuthentication yes).
# Check before reloading: sudo sshd -t && sudo systemctl reload ssh
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
